spring:
  application:
    name: finance-app

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns schema changes, not Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    # dev-only secret, real one goes in an env var for docker/prod, never commit a real one
    secret: "=Sl$?o%[M.)fkPm4QG&c2q<Vssjl[Hj3gz2B.OQ}pZ#"
    expiration-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health, info